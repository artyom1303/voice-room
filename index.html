<script>
"use strict";
(function(){
// ---- src/shared/protocol.js
// Shared validation + sanitizing, used by worker and client.
const MAX_MSG_BYTES = 256;
const MAX_NAME = 16;
const MAX_ROOM = 32;

function sanitizeRoom(s) {
  return String(s == null ? '' : s).toLowerCase().replace(/[^a-z0-9_-]/g, '').slice(0, MAX_ROOM);
}

function isValidRoom(s) {
  return typeof s === 'string' && /^[a-z0-9_-]{1,32}$/.test(s);
}

function sanitizeName(s) {
  return String(s == null ? '' : s)
    .replace(/[\u0000-\u001f\u007f<>&"'`]/g, '')
    .replace(/\s+/g, ' ')
    .trim()
    .slice(0, MAX_NAME);
}

function isValidId(s) {
  return typeof s === 'string' && /^[A-Za-z0-9]{6,32}$/.test(s);
}

// Parse one client message. Returns a normalized object or null if invalid.
function parseClientMsg(raw) {
  if (typeof raw !== 'string' || raw.length === 0 || raw.length > MAX_MSG_BYTES) return null;
  let m;
  try { m = JSON.parse(raw); } catch (e) { return null; }
  if (!m || typeof m !== 'object' || Array.isArray(m)) return null;
  if (m.t === 'in') {
    const x = m.x, y = m.y;
    if (typeof x !== 'number' || typeof y !== 'number') return null;
    if (!Number.isFinite(x) || !Number.isFinite(y)) return null;
    if (x < -1 || x > 1 || y < -1 || y > 1) return null;
    return { t: 'in', x, y };
  }
  if (m.t === 'ping') return { t: 'ping' };
  return null;
}

// Simple token bucket: capacity tokens, refills `rate` per second.
function makeBucket(capacity, rate, now) {
  return { tokens: capacity, capacity, rate, last: now };
}

function takeToken(b, now) {
  const dt = Math.max(0, (now - b.last) / 1000);
  b.last = now;
  b.tokens = Math.min(b.capacity, b.tokens + dt * b.rate);
  if (b.tokens >= 1) { b.tokens -= 1; return true; }
  return false;
}

// ---- src/shared/game.js
// Pure Coin Grab game logic. No I/O, deterministic given rand().
const ARENA = 100;
const PLAYER_R = 4;
const COIN_R = 3;
const SPEED = 40;          // units per second
const WIN_SCORE = 5;
const WIN_PAUSE = 3;       // seconds
const MAX_PLAYERS = 8;
const COLORS = ['#ff5d73', '#4dd2ff', '#ff6bd6', '#7cff6b', '#c77dff', '#ff9f43', '#f5f5f5', '#00e0b0'];

function createGame(rand) {
  const g = { rand: rand || Math.random, players: new Map(), coin: { x: 50, y: 50 }, phase: 'play', winner: '', pause: 0 };
  placeCoin(g);
  return g;
}

function placeCoin(g) {
  const m = COIN_R + 2;
  for (let tries = 0; tries < 20; tries++) {
    const x = m + g.rand() * (ARENA - 2 * m);
    const y = m + g.rand() * (ARENA - 2 * m);
    let ok = true;
    for (const p of g.players.values()) {
      if (Math.hypot(p.x - x, p.y - y) < PLAYER_R + COIN_R + 6) { ok = false; break; }
    }
    g.coin = { x, y };
    if (ok) return;
  }
}

function freeColor(g) {
  const used = new Set([...g.players.values()].map(p => p.c));
  for (let i = 0; i < COLORS.length; i++) if (!used.has(i)) return i;
  return 0;
}

function addPlayer(g, id, name) {
  const existing = g.players.get(id);
  if (existing) { existing.name = name; existing.online = true; return existing; }
  if (g.players.size >= MAX_PLAYERS) return null;
  const p = {
    id, name, c: freeColor(g), score: 0, online: true, offSince: 0,
    x: PLAYER_R + g.rand() * (ARENA - 2 * PLAYER_R),
    y: PLAYER_R + g.rand() * (ARENA - 2 * PLAYER_R),
    ix: 0, iy: 0,
  };
  g.players.set(id, p);
  return p;
}

function removePlayer(g, id) { g.players.delete(id); }

function setInput(g, id, x, y) {
  const p = g.players.get(id);
  if (!p) return;
  if (!Number.isFinite(x) || !Number.isFinite(y)) { x = 0; y = 0; }
  const len = Math.hypot(x, y);
  if (len > 1) { x /= len; y /= len; }
  p.ix = x; p.iy = y;
}

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

// Advance by dt seconds. Returns list of events.
function step(g, dt) {
  const ev = [];
  dt = clamp(dt, 0, 0.25);
  if (g.phase === 'win') {
    g.pause -= dt;
    if (g.pause <= 0) {
      g.phase = 'play'; g.winner = '';
      for (const p of g.players.values()) p.score = 0;
      placeCoin(g);
      ev.push({ e: 'reset' });
    }
    return ev;
  }
  for (const p of g.players.values()) {
    if (!p.online) continue;
    p.x = clamp(p.x + p.ix * SPEED * dt, PLAYER_R, ARENA - PLAYER_R);
    p.y = clamp(p.y + p.iy * SPEED * dt, PLAYER_R, ARENA - PLAYER_R);
  }
  for (const p of g.players.values()) {
    if (!p.online) continue;
    if (Math.hypot(p.x - g.coin.x, p.y - g.coin.y) <= PLAYER_R + COIN_R) {
      p.score++;
      ev.push({ e: 'coin', id: p.id });
      if (p.score >= WIN_SCORE) {
        g.phase = 'win'; g.winner = p.name; g.pause = WIN_PAUSE;
        ev.push({ e: 'win', id: p.id, name: p.name });
      } else {
        placeCoin(g);
      }
      break; // one coin per tick
    }
  }
  return ev;
}

const r1 = v => Math.round(v * 10) / 10;

function snapshot(g) {
  const p = [];
  for (const q of g.players.values()) p.push({ i: q.id, n: q.name, x: r1(q.x), y: r1(q.y), s: q.score, c: q.c, o: q.online ? 1 : 0 });
  return { t: 's', p, c: { x: r1(g.coin.x), y: r1(g.coin.y) }, ph: g.phase, w: g.winner };
}

// ---- src/client/util.js
function configError(cfg) {
  const u = cfg && cfg.WORKER_URL;
  if (!u || typeof u !== 'string' || u.indexOf('YOUR-') !== -1) return 'Fill in config.js first.';
  return '';
}

function makeId(rand) {
  const r = rand || Math.random;
  const c = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  let s = '';
  for (let i = 0; i < 12; i++) s += c[Math.floor(r() * c.length)];
  return s;
}

function store(kind) {
  let s = null;
  try { s = kind === 'session' ? window.sessionStorage : window.localStorage; } catch (e) {}
  return {
    get(k) { try { return s ? s.getItem(k) : null; } catch (e) { return null; } },
    set(k, v) { try { if (s) s.setItem(k, v); } catch (e) {} },
  };
}

function rosterRows(st, wins) {
  if (!st) return [];
  return st.p.slice().sort((a, b) => b.s - a.s || a.n.localeCompare(b.n))
    .map(p => ({ id: p.i, name: p.n, score: p.s, color: p.c, online: !!p.o, wins: (wins && wins[p.n]) || 0 }));
}

// ---- src/client/input.js
// Input: keyboard + touch/mouse drag joystick. Pure helpers are unit-tested.
const JOY_RADIUS = 60;

function keysToVec(keys) {
  let x = 0, y = 0;
  if (keys.has('ArrowLeft') || keys.has('KeyA')) x -= 1;
  if (keys.has('ArrowRight') || keys.has('KeyD')) x += 1;
  if (keys.has('ArrowUp') || keys.has('KeyW')) y -= 1;
  if (keys.has('ArrowDown') || keys.has('KeyS')) y += 1;
  const len = Math.hypot(x, y);
  return len > 0 ? [x / len, y / len] : [0, 0];
}

function dragToVec(dx, dy, radius) {
  const len = Math.hypot(dx, dy);
  if (len < 6) return [0, 0];
  const s = Math.min(1, len / radius);
  return [dx / len * s, dy / len * s];
}

function quantize(v) {
  const q = n => { const r = Math.round(n * 100) / 100; return Math.max(-1, Math.min(1, r)) || 0; };
  return [q(v[0]), q(v[1])];
}

const GAME_KEYS = new Set(['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'KeyA', 'KeyD', 'KeyW', 'KeyS']);

function createInput(el) {
  const keys = new Set();
  const joy = { active: false, pid: null, ox: 0, oy: 0, cx: 0, cy: 0 };
  window.addEventListener('keydown', (e) => {
    if (!GAME_KEYS.has(e.code)) return;
    if (e.target && e.target.tagName === 'INPUT') return;
    keys.add(e.code); e.preventDefault();
  });
  window.addEventListener('keyup', (e) => { keys.delete(e.code); });
  window.addEventListener('blur', () => { keys.clear(); joy.active = false; });

  el.addEventListener('pointerdown', (e) => {
    if (joy.active) return;
    joy.active = true; joy.pid = e.pointerId;
    joy.ox = joy.cx = e.clientX; joy.oy = joy.cy = e.clientY;
    try { el.setPointerCapture(e.pointerId); } catch (err) {}
    e.preventDefault();
  });
  el.addEventListener('pointermove', (e) => {
    if (!joy.active || e.pointerId !== joy.pid) return;
    joy.cx = e.clientX; joy.cy = e.clientY; e.preventDefault();
  });
  const end = (e) => { if (e.pointerId === joy.pid) { joy.active = false; joy.pid = null; } };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);

  return {
    joy,
    vec() {
      if (joy.active) return quantize(dragToVec(joy.cx - joy.ox, joy.cy - joy.oy, JOY_RADIUS));
      return quantize(keysToVec(keys));
    },
  };
}

// ---- src/client/net.js
// WebSocket connection with auto-reconnect.
function wsUrl(base, room, name, id) {
  const b = String(base).replace(/\/+$/, '').replace(/^http(s?):/i, 'ws$1:');
  return b + '/ws?room=' + encodeURIComponent(room) + '&name=' + encodeURIComponent(name) + '&id=' + encodeURIComponent(id);
}

function backoff(n) { return Math.min(5000, 500 * Math.pow(2, n)); }

// Close codes that mean "don't retry".
const FATAL = { 4000: 'You joined from another tab.', 4001: 'Room is full.', 1008: 'Disconnected by server.' };

class Net {
  constructor(opts) {
    this.url = opts.url; this.onMsg = opts.onMsg; this.onStatus = opts.onStatus || (() => {});
    this.ws = null; this.tries = 0; this.stopped = false; this.lastRx = 0; this.retryT = null;
    this.watch = setInterval(() => this.check(), 2000);
  }

  connect() {
    if (this.stopped) return;
    this.onStatus(this.tries ? 'reconnecting' : 'connecting');
    let ws;
    try { ws = new WebSocket(this.url); } catch (e) { this.retry(); return; }
    this.ws = ws;
    ws.onopen = () => { this.tries = 0; this.lastRx = Date.now(); this.onStatus('online'); };
    ws.onmessage = (e) => {
      this.lastRx = Date.now();
      let m; try { m = JSON.parse(e.data); } catch (err) { return; }
      this.onMsg(m);
    };
    ws.onclose = (e) => {
      if (this.ws !== ws) return;
      this.ws = null;
      if (FATAL[e.code]) { this.stopped = true; this.onStatus('fatal', FATAL[e.code]); return; }
      this.retry();
    };
    ws.onerror = () => {};
  }

  retry() {
    if (this.stopped) return;
    this.onStatus('reconnecting');
    clearTimeout(this.retryT);
    this.retryT = setTimeout(() => this.connect(), backoff(this.tries++));
  }

  check() {
    // Server streams state at 20Hz; silence means a dead socket.
    if (this.ws && this.ws.readyState === 1 && Date.now() - this.lastRx > 6000) {
      const ws = this.ws; this.ws = null;
      try { ws.close(); } catch (e) {}
      this.retry();
    }
  }

  get open() { return !!this.ws && this.ws.readyState === 1; }

  send(obj) { if (this.open) { try { this.ws.send(JSON.stringify(obj)); return true; } catch (e) {} } return false; }

  close() {
    this.stopped = true; clearTimeout(this.retryT); clearInterval(this.watch);
    if (this.ws) { const ws = this.ws; this.ws = null; try { ws.close(1000); } catch (e) {} }
  }
}

// ---- src/client/motion.js

// --- Others: buffered interpolation (render slightly in the past, between two snapshots) ---
const INTERP_DELAY = 100; // ms

function pushSnap(buf, t, players, max) {
  const p = new Map();
  for (const q of players) p.set(q.i, { x: q.x, y: q.y });
  buf.push({ t, p });
  while (buf.length > (max || 30)) buf.shift();
}

function interpAt(buf, t) {
  const out = new Map();
  if (!buf.length) return out;
  let a = buf[0], b = null;
  for (let i = 0; i < buf.length; i++) {
    if (buf[i].t <= t) a = buf[i];
    else { b = buf[i]; break; }
  }
  if (!b || a === b || a.t > t) { for (const [id, v] of (a.t > t ? buf[0] : a).p) out.set(id, { x: v.x, y: v.y }); return out; }
  const k = (t - a.t) / (b.t - a.t);
  for (const [id, vb] of b.p) {
    const va = a.p.get(id);
    if (!va || Math.hypot(vb.x - va.x, vb.y - va.y) > 25) out.set(id, { x: vb.x, y: vb.y });
    else out.set(id, { x: va.x + (vb.x - va.x) * k, y: va.y + (vb.y - va.y) * k });
  }
  return out;
}

// --- Self: client-side prediction, gently pulled toward the server ---
const clampM = (v, a, b) => v < a ? a : v > b ? b : v;

// pred: {x,y} or null; vec: [x,y] input; server: {x,y} latest authoritative; lead: seconds the server lags behind us.
function predictStep(pred, vec, dt, server, lead) {
  if (!server) return null;
  if (!pred) return { x: server.x, y: server.y };
  dt = clampM(dt, 0, 0.1);
  pred.x = clampM(pred.x + vec[0] * SPEED * dt, PLAYER_R, ARENA - PLAYER_R);
  pred.y = clampM(pred.y + vec[1] * SPEED * dt, PLAYER_R, ARENA - PLAYER_R);
  const tx = clampM(server.x + vec[0] * SPEED * lead, PLAYER_R, ARENA - PLAYER_R);
  const ty = clampM(server.y + vec[1] * SPEED * lead, PLAYER_R, ARENA - PLAYER_R);
  const ex = tx - pred.x, ey = ty - pred.y;
  if (Math.hypot(ex, ey) > 15) { pred.x = tx; pred.y = ty; return pred; }
  const k = 1 - Math.exp(-dt * 6);
  pred.x += ex * k; pred.y += ey * k;
  return pred;
}

// ---- src/client/render.js

// Fit the square arena into the canvas, below the HUD.
function layout(w, h, top) {
  const pad = 10;
  const size = Math.max(50, Math.min(w - 2 * pad, h - top - 2 * pad));
  return { size, ox: (w - size) / 2, oy: top + (h - top - size) / 2, k: size / ARENA };
}

function draw(ctx, w, h, top, st, myId, disp, joy, t) {
  ctx.clearRect(0, 0, w, h);
  if (!st) return;
  const L = layout(w, h, top);
  ctx.fillStyle = '#1a1d2e';
  ctx.fillRect(L.ox, L.oy, L.size, L.size);
  ctx.strokeStyle = '#3a3f5c'; ctx.lineWidth = 2;
  ctx.strokeRect(L.ox, L.oy, L.size, L.size);

  // coin
  if (st.ph === 'play') {
    const pulse = 1 + 0.12 * Math.sin(t / 150);
    ctx.fillStyle = '#ffcc33';
    ctx.beginPath();
    ctx.arc(L.ox + st.c.x * L.k, L.oy + st.c.y * L.k, COIN_R * L.k * pulse, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#a66f00'; ctx.lineWidth = Math.max(2, L.k * 0.6); ctx.stroke();
  }

  ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  ctx.font = Math.max(11, Math.round(L.k * 3)) + 'px system-ui, sans-serif';
  for (const p of st.p) {
    const d = disp.get(p.i) || p;
    const x = L.ox + d.x * L.k, y = L.oy + d.y * L.k;
    ctx.globalAlpha = p.o ? 1 : 0.35;
    ctx.fillStyle = COLORS[p.c] || '#fff';
    ctx.beginPath(); ctx.arc(x, y, PLAYER_R * L.k, 0, Math.PI * 2); ctx.fill();
    if (p.i === myId) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke(); }
    ctx.fillStyle = '#fff';
    ctx.fillText(p.n + ' ' + p.s, x, y - PLAYER_R * L.k - 3);
  }
  ctx.globalAlpha = 1;

  if (joy && joy.active) {
    ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(joy.ox, joy.oy, 60, 0, Math.PI * 2); ctx.stroke();
    const dx = joy.cx - joy.ox, dy = joy.cy - joy.oy, len = Math.hypot(dx, dy), s = len > 60 ? 60 / len : 1;
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    ctx.beginPath(); ctx.arc(joy.ox + dx * s, joy.oy + dy * s, 22, 0, Math.PI * 2); ctx.fill();
  }
}

// ---- src/client/voice.js
// Voice chat via LiveKit. Optional: any failure leaves the game running.
async function startVoice(cfg, room, name, id, onStatus) {
  const LK = window.LivekitClient;
  if (!LK) throw new Error('voice library not loaded');
  if (!cfg.LIVEKIT_URL) throw new Error('no LIVEKIT_URL');
  const base = String(cfg.WORKER_URL).replace(/\/+$/, '');
  const r = await fetch(base + '/token?room=' + encodeURIComponent(room) + '&name=' + encodeURIComponent(name) + '&id=' + encodeURIComponent(id));
  if (!r.ok) throw new Error('token ' + r.status);
  const { token } = await r.json();
  if (!token) throw new Error('no token');

  const lk = new LK.Room({ adaptiveStream: true, dynacast: true });
  const audioEls = [];
  lk.on(LK.RoomEvent.TrackSubscribed, (track) => {
    if (track.kind === 'audio') { const el = track.attach(); el.style.display = 'none'; document.body.appendChild(el); audioEls.push(el); }
  });
  lk.on(LK.RoomEvent.TrackUnsubscribed, (track) => { track.detach().forEach(el => el.remove()); });
  lk.on(LK.RoomEvent.Disconnected, () => onStatus('off'));
  await lk.connect(cfg.LIVEKIT_URL, token);
  try { await lk.startAudio(); } catch (e) {}
  let muted = false;
  try {
    await lk.localParticipant.setMicrophoneEnabled(true, { echoCancellation: true, noiseSuppression: true, autoGainControl: true });
  } catch (e) { muted = true; onStatus('nomic'); }
  if (!muted) onStatus('on');
  return {
    get muted() { return muted; },
    async setMuted(m) {
      await lk.localParticipant.setMicrophoneEnabled(!m, { echoCancellation: true, noiseSuppression: true, autoGainControl: true });
      muted = m; onStatus(m ? 'muted' : 'on');
    },
    stop() { try { lk.disconnect(); } catch (e) {} audioEls.forEach(el => el.remove()); },
  };
}

// ---- src/client/app.js








const CFG = window.APP_CONFIG || {};
const $ = (id) => document.getElementById(id);
const local = store('local'), session = store('session');

const app = { net: null, voice: null, st: null, wins: {}, myId: '', disp: new Map(), lastSent: '', lastSentAt: 0, room: '', name: '',
  buf: [], pred: null, rtt: 0, pingAt: 0, pingSent: 0, lastFrame: 0 };

// --- no zoom / long-press / double-tap ---
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());
document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });

function show(screen) {
  $('join').hidden = screen !== 'join';
  $('game').hidden = screen !== 'game';
}

function setMsg(t) { $('msg').textContent = t || ''; }

function init() {
  $('name').value = local.get('cg_name') || '';
  $('room').value = local.get('cg_room') || '';
  const err = configError(CFG);
  if (err) { setMsg(err); $('joinBtn').disabled = true; }
  $('room').addEventListener('input', () => { const v = sanitizeRoom($('room').value); if (v !== $('room').value) $('room').value = v; });
  $('joinForm').addEventListener('submit', (e) => { e.preventDefault(); join(); });
  $('leave').addEventListener('click', leave);
  $('mute').addEventListener('click', toggleMute);
  const fsOk = document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen;
  if (!fsOk) $('fs').hidden = true;
  $('fs').addEventListener('click', toggleFullscreen);
  show('join');
}

function toggleFullscreen() {
  const d = document, el = d.documentElement;
  if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
  else { const f = el.requestFullscreen || el.webkitRequestFullscreen; if (f) { try { const p = f.call(el); if (p && p.catch) p.catch(() => {}); } catch (e) {} } }
}

function join() {
  if (configError(CFG)) return;
  const name = sanitizeName($('name').value);
  const room = sanitizeRoom($('room').value);
  if (!name) { setMsg('Enter a name.'); return; }
  if (!isValidRoom(room)) { setMsg('Room: a-z, 0-9, _ or -, up to 32.'); return; }
  local.set('cg_name', name); local.set('cg_room', room);
  let id = session.get('cg_id');
  if (!id) { id = makeId(); session.set('cg_id', id); }
  app.myId = id; app.room = room; app.name = name; app.st = null; app.disp.clear(); app.lastSent = ''; app.buf = []; app.pred = null; app.rtt = 0;
  setMsg('');
  $('roomLabel').textContent = room;
  show('game');
  app.net = new Net({
    url: wsUrl(CFG.WORKER_URL, room, name, id),
    onMsg,
    onStatus: (s, why) => {
      $('status').textContent = s === 'online' ? '' : s === 'fatal' ? why : s === 'connecting' ? 'Connecting…' : 'Reconnecting…';
      if (s === 'online') { app.lastSent = ''; app.pingSent = 0; }
      if (s === 'fatal') { leave(); setMsg(why); }
    },
  });
  app.net.connect();
  startVoiceSafe();
}

function setVoice(s) {
  const b = $('mute');
  b.dataset.state = s;
  b.textContent = { on: '🎤 Mute', muted: '🔇 Unmute', off: 'Voice off', nomic: 'No mic', connecting: 'Voice…' }[s] || 'Voice off';
  b.disabled = !(s === 'on' || s === 'muted');
}

async function startVoiceSafe() {
  setVoice('connecting');
  try {
    const v = await startVoice(CFG, app.room, app.name, app.myId, setVoice);
    if (!app.net) { v.stop(); return; }
    app.voice = v;
  } catch (e) {
    setVoice('off');
  }
}

async function toggleMute() {
  if (!app.voice) return;
  try { await app.voice.setMuted(!app.voice.muted); } catch (e) {}
}

function leave() {
  if (app.net) { app.net.close(); app.net = null; }
  if (app.voice) { app.voice.stop(); app.voice = null; }
  app.st = null;
  show('join');
}

function onMsg(m) {
  if (!m || typeof m !== 'object') return;
  if (m.t === 's') { app.st = m; pushSnap(app.buf, performance.now(), m.p); renderHud(); }
  else if (m.t === 'pong') {
    if (app.pingSent) {
      const r = performance.now() - app.pingSent; app.pingSent = 0;
      app.rtt = app.rtt ? app.rtt * 0.7 + r * 0.3 : r;
      $('ping').textContent = Math.round(app.rtt) + ' ms';
    }
  }
  else if (m.t === 'wins') { app.wins = m.w || {}; renderHud(); }
  else if (m.t === 'err') { setMsg(m.m); }
}

function renderHud() {
  const st = app.st;
  const rows = rosterRows(st, app.wins);
  const ul = $('roster');
  ul.textContent = '';
  for (const r of rows) {
    const li = document.createElement('li');
    li.className = r.online ? '' : 'off';
    if (r.id === app.myId) li.classList.add('me');
    const dot = document.createElement('span'); dot.className = 'dot'; dot.style.background = COLORS[r.color];
    li.appendChild(dot);
    li.appendChild(document.createTextNode(r.name + ' ' + r.score + '/' + WIN_SCORE + (r.wins ? ' 🏆' + r.wins : '') + (r.online ? '' : ' (away)')));
    ul.appendChild(li);
  }
  const ban = $('banner');
  if (st && st.ph === 'win') { ban.hidden = false; ban.textContent = st.w + ' wins!'; }
  else ban.hidden = true;
}

// --- main loop ---
const cv = $('cv');
const ctx = cv.getContext('2d');
const input = createInput(cv);
function resize() {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(innerWidth * dpr); cv.height = Math.round(innerHeight * dpr);
  cv.style.width = innerWidth + 'px'; cv.style.height = innerHeight + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

function frame(t) {
  const dt = app.lastFrame ? (t - app.lastFrame) / 1000 : 0;
  app.lastFrame = t;
  if (app.net) {
    const now = performance.now();
    let v = input.vec();
    const key = v[0] + ',' + v[1];
    if (key !== app.lastSent && now - app.lastSentAt > 66) {
      if (app.net.send({ t: 'in', x: v[0], y: v[1] })) { app.lastSent = key; app.lastSentAt = now; }
    }
    if (!app.pingSent && now - app.pingAt > 2000 && app.net.open) {
      if (app.net.send({ t: 'ping' })) { app.pingSent = now; app.pingAt = now; }
    } else if (app.pingSent && now - app.pingSent > 5000) app.pingSent = 0;

    const st = app.st;
    if (st) {
      const shown = interpAt(app.buf, now - INTERP_DELAY);
      const me = st.p.find(p => p.i === app.myId);
      if (me && me.o) {
        if (st.ph !== 'play') v = [0, 0];
        app.pred = predictStep(app.pred, v, dt, me, (app.rtt || 100) / 1000 + 0.025);
        shown.set(app.myId, { x: app.pred.x, y: app.pred.y });
      } else app.pred = null;
      app.disp = shown;
    }
    const top = $('hud').getBoundingClientRect().bottom;
    draw(ctx, innerWidth, innerHeight, top, st, app.myId, app.disp, input.joy, t);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

window.__cg = app; // for tests/debugging
init();

})();
</script>

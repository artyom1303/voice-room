<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0f1d">
<title>Squares</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; }
  input { user-select: text; -webkit-user-select: text; }
  html, body { height: 100%; overscroll-behavior: none; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #0b0f1d; color: #e9edfb; }
  .hidden { display: none !important; }

  #join { max-width: 420px; margin: 0 auto; padding: 48px 20px; display: flex; flex-direction: column; gap: 14px; }
  #join h1 { text-align: center; font-size: 26px; margin-bottom: 8px; }
  #join label { font-size: 13px; color: #97a1c4; }
  #join input { width: 100%; margin-top: 6px; padding: 13px; font-size: 16px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,.12); background: #0d1226; color: inherit; outline: none; }
  button { font: inherit; color: inherit; border: none; cursor: pointer; touch-action: none; }
  #btn-join { padding: 15px; font-size: 16px; font-weight: 650; border-radius: 12px; color: #fff;
      background: linear-gradient(135deg, #6c8cff, #8f6cff); touch-action: manipulation; }
  #btn-join:disabled { opacity: .5; }
  #status { min-height: 20px; text-align: center; font-size: 14px; color: #97a1c4; }
  #status.err { color: #ff6b6b; }

  #room canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
  #top { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between;
      align-items: center; padding: 12px; z-index: 2; }
  #info { background: rgba(13,18,38,.7); padding: 8px 14px; border-radius: 12px; font-size: 14px; }
  #btn-leave { background: rgba(255,107,107,.2); border: 1px solid rgba(255,107,107,.4);
      color: #ffb3b3; padding: 9px 16px; border-radius: 12px; touch-action: manipulation; }
  #bottom { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between;
      align-items: flex-end; padding: 14px 14px calc(14px + env(safe-area-inset-bottom)); z-index: 2; }
  .pad { display: flex; gap: 10px; }
  .pbtn { width: 68px; height: 68px; border-radius: 50%; font-size: 22px; color: #e9edfb;
      background: rgba(20,26,46,.7); border: 1px solid rgba(255,255,255,.15); }
  .pbtn.held { background: rgba(108,140,255,.5); }
  #bj { width: 84px; height: 84px; font-size: 14px; font-weight: 700; }
  #btn-mute { width: 52px; height: 52px; border-radius: 50%; font-size: 22px; touch-action: manipulation;
      background: rgba(53,217,154,.25); border: 1px solid rgba(53,217,154,.6); }
  #btn-mute.muted { background: rgba(255,107,107,.25); border-color: rgba(255,107,107,.6); }
  #audio-out { display: none; }
</style>
</head>
<body>

<main id="join">
  <h1>Squares</h1>
  <label>Room name <input id="in-room" placeholder="e.g. squad" maxlength="32" autocomplete="off" autocapitalize="none" spellcheck="false"></label>
  <label>Your name <input id="in-name" placeholder="e.g. Alex" maxlength="32"></label>
  <button id="btn-join">Join</button>
  <p id="status"></p>
</main>

<main id="room" class="hidden">
  <canvas id="c"></canvas>
  <div id="top">
    <div id="info"></div>
    <button id="btn-leave">Leave</button>
  </div>
  <div id="bottom">
    <div class="pad">
      <button id="bl" class="pbtn">◀</button>
      <button id="br" class="pbtn">▶</button>
    </div>
    <button id="btn-mute">🎤</button>
    <button id="bj" class="pbtn">JUMP</button>
  </div>
</main>

<div id="audio-out"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.23.0/dist/livekit-client.umd.js"></script>
<script>
"use strict";
const CFG = window.APP_CONFIG || {};
const LK = window.LivekitClient;
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const WORLD_W = 200;          // must match worker.js
const HEAR = 16;              // voice range in metres
const SPD = 6, G = 30, JUMP = 11;

// ── state ───────────────────────────────────────────────────────
let lkRoom = null, localTrack = null, muted = false;
let ws = null, wsUrl = "", active = false, retryTimer = 0;
let myId = "", myName = "";
const me = { x: 100, y: -1, vy: 0 };
const remotes = new Map();    // id -> { name, x, y, tx, ty }
const input = { left: false, right: false, jump: false };

function setStatus(msg, err) { $("status").textContent = msg || ""; $("status").className = err ? "err" : ""; }
function hue(str) { let h = 0; for (const c of str) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }

// ── join / leave (LiveKit voice) ────────────────────────────────
async function join() {
  const roomName = $("in-room").value.toLowerCase().replace(/[^a-z0-9_-]/g, "").slice(0, 32);
  const name = $("in-name").value.trim().slice(0, 32);
  if (!roomName) return setStatus("Enter a room name.", true);
  if (!name) return setStatus("Enter your name.", true);
  if (!CFG.WORKER_URL || !CFG.LIVEKIT_URL || CFG.WORKER_URL.includes("YOUR-"))
    return setStatus("Fill in config.js first.", true);
  if (!LK) return setStatus("Voice SDK failed to load. Reload.", true);

  $("btn-join").disabled = true;
  try {
    setStatus("Connecting…");
    const res = await fetch(CFG.WORKER_URL + "/token?room=" + encodeURIComponent(roomName) +
                            "&name=" + encodeURIComponent(name));
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || "Token error " + res.status);

    const r = new LK.Room();
    lkRoom = r;
    r.on(LK.RoomEvent.TrackSubscribed, (track, pub, p) => {
      if (track.kind !== LK.Track.Kind.Audio) return;
      const a = track.attach();
      a.dataset.identity = p.identity;
      $("audio-out").appendChild(a);
    });
    r.on(LK.RoomEvent.TrackUnsubscribed, (track) => track.detach().forEach((n) => n.remove()));
    r.on(LK.RoomEvent.Disconnected, () => { if (lkRoom === r) { lkRoom = null; leave("Disconnected."); } });

    await r.connect(CFG.LIVEKIT_URL, data.token);
    localTrack = await LK.createLocalAudioTrack({ echoCancellation: true, noiseSuppression: true, autoGainControl: true });
    await r.localParticipant.publishTrack(localTrack);
    if (r.startAudio) await r.startAudio();

    myId = r.localParticipant.identity;   // same id for voice + game
    myName = name;
    muted = false; updateMute();
    $("join").classList.add("hidden");
    $("room").classList.remove("hidden");
    setStatus("");
    startGame(roomName);
  } catch (e) {
    if (lkRoom) { try { lkRoom.disconnect(); } catch (_) {} lkRoom = null; }
    setStatus(e.message || String(e), true);
  } finally {
    $("btn-join").disabled = false;
  }
}

function leave(msg) {
  const r = lkRoom; lkRoom = null;
  if (r) { try { r.disconnect(); } catch (_) {} }
  if (localTrack) { try { localTrack.stop(); } catch (_) {} localTrack = null; }
  stopGame();
  $("audio-out").innerHTML = "";
  $("room").classList.add("hidden");
  $("join").classList.remove("hidden");
  setStatus(msg || "");
}

async function toggleMute() {
  if (!lkRoom) return;
  muted = !muted;
  try { await lkRoom.localParticipant.setMicrophoneEnabled(!muted); }
  catch (_) { muted = !muted; }
  updateMute();
}
function updateMute() {
  $("btn-mute").classList.toggle("muted", muted);
  $("btn-mute").textContent = muted ? "🔇" : "🎤";
}

// ── game connection ─────────────────────────────────────────────
function startGame(roomName) {
  active = true;
  remotes.clear();
  wsUrl = CFG.WORKER_URL.replace(/^http/, "ws") + "/ws?room=" + encodeURIComponent(roomName) +
          "&name=" + encodeURIComponent(myName) + "&id=" + encodeURIComponent(myId);
  $("info").textContent = roomName;
  connectWs();
  lastTs = 0;
  requestAnimationFrame(loop);
}
function stopGame() {
  active = false;
  clearTimeout(retryTimer); retryTimer = 0;
  if (ws) { try { ws.close(); } catch (_) {} ws = null; }
  remotes.clear();
  input.left = input.right = input.jump = false;
}
function connectWs() {
  const sock = new WebSocket(wsUrl);
  ws = sock;
  sock.onmessage = (ev) => {
    if (ws !== sock) return;
    let m; try { m = JSON.parse(ev.data); } catch (_) { return; }
    if (m.t === "init") {
      remotes.clear();
      for (const id in m.players) {
        const p = m.players[id];
        if (id === myId) { me.x = p.x; me.y = p.y; me.vy = 0; continue; }
        remotes.set(id, { name: p.name, x: p.x, y: p.y, tx: p.x, ty: p.y });
      }
    } else if (m.t === "+") {
      remotes.set(m.id, { name: m.name, x: m.x, y: m.y, tx: m.x, ty: m.y });
    } else if (m.t === "-") {
      remotes.delete(m.id);
    } else if (m.t === "p") {
      const r = remotes.get(m.id);
      if (r) { r.tx = m.x; r.ty = m.y; }
    }
    $("info").textContent = $("info").textContent.split(" · ")[0] + " · " + (1 + remotes.size) + " here";
  };
  sock.onclose = () => {
    if (active && ws === sock) retryTimer = setTimeout(() => { if (active) connectWs(); }, 2000);
  };
  sock.onerror = () => { try { sock.close(); } catch (_) {} };
}

// ── game loop ───────────────────────────────────────────────────
const canvas = $("c"), ctx = canvas.getContext("2d");
let lastTs = 0, lastSend = 0, lastHb = 0, sentX = -1, sentY = -1;

function loop(ts) {
  if (!active) return;
  requestAnimationFrame(loop);
  if (!lastTs) lastTs = ts;
  const dt = Math.min((ts - lastTs) / 1000, 0.05);
  lastTs = ts;
  step(dt);
  render();
  proximity();
}

function step(dt) {
  const vx = ((input.right ? 1 : 0) - (input.left ? 1 : 0)) * SPD;
  me.x = clamp(me.x + vx * dt, 0, WORLD_W - 1);
  if (input.jump && me.y >= -1) me.vy = -JUMP;
  me.vy += G * dt;
  me.y += me.vy * dt;
  if (me.y >= -1) { me.y = -1; me.vy = 0; }   // flat ground at y = 0, square is 1 m tall

  const k = Math.min(1, dt * 14);
  for (const r of remotes.values()) { r.x += (r.tx - r.x) * k; r.y += (r.ty - r.y) * k; }

  const now = performance.now();
  if (ws && ws.readyState === 1) {
    if (now - lastSend > 70) {
      const x = Math.round(me.x * 100) / 100, y = Math.round(me.y * 100) / 100;
      if (x !== sentX || y !== sentY) {
        ws.send(JSON.stringify({ t: "p", x, y }));
        sentX = x; sentY = y; lastSend = now;
      }
    }
    if (now - lastHb > 5000) { ws.send(JSON.stringify({ t: "hb" })); lastHb = now; }
  }
}

function render() {
  const dpr = window.devicePixelRatio || 1;
  const cw = window.innerWidth, ch = window.innerHeight;
  if (canvas.width !== ((cw * dpr) | 0) || canvas.height !== ((ch * dpr) | 0)) {
    canvas.width = (cw * dpr) | 0; canvas.height = (ch * dpr) | 0;
  }
  const pxm = clamp(cw / 22, 18, 48);          // pixels per metre
  const viewW = cw / pxm;
  const camX = clamp(me.x + 0.5 - viewW / 2, 0, WORLD_W - viewW);
  const groundY = ch * 0.7;                    // screen y of the ground line

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = "#24305c"; ctx.fillRect(0, 0, cw, ch);                   // sky
  ctx.fillStyle = "#3b7a34"; ctx.fillRect(0, groundY, cw, ch - groundY);   // ground

  ctx.setTransform(dpr * pxm, 0, 0, dpr * pxm, -camX * dpr * pxm, groundY * dpr);
  ctx.fillStyle = "#2b5a26"; ctx.fillRect(0, 0, WORLD_W, 0.25);            // grass edge
  ctx.fillStyle = "#c33"; ctx.fillRect(-0.3, -2, 0.3, 2);                  // left wall marker
  ctx.fillRect(WORLD_W, -2, 0.3, 2);                                       // right wall marker

  for (const r of remotes.values()) drawSquare(r.x, r.y, r.name);
  drawSquare(me.x, me.y, myName);
}

function drawSquare(x, y, name) {
  ctx.fillStyle = "hsl(" + hue(name || "?") + " 72% 62%)";
  ctx.fillRect(x, y, 1, 1);
  ctx.strokeStyle = "rgba(0,0,0,.5)"; ctx.lineWidth = 0.06;
  ctx.strokeRect(x, y, 1, 1);
  ctx.font = "600 0.4px system-ui, sans-serif";
  ctx.textAlign = "center";
  ctx.fillStyle = "#fff";
  ctx.fillText(name || "", x + 0.5, y - 0.2);
}

// proximity voice: full volume up close, silent at HEAR metres
function proximity() {
  const kids = $("audio-out").children;
  for (let i = 0; i < kids.length; i++) {
    const r = remotes.get(kids[i].dataset.identity);
    kids[i].volume = r ? clamp(1 - Math.hypot(r.x - me.x, r.y - me.y) / HEAR, 0, 1) : 1;
  }
}

// ── input ───────────────────────────────────────────────────────
function bindPad(btn, key) {
  const down = (e) => { e.preventDefault(); input[key] = true; btn.classList.add("held"); };
  const up = () => { input[key] = false; btn.classList.remove("held"); };
  btn.addEventListener("pointerdown", down);
  btn.addEventListener("pointerup", up);
  btn.addEventListener("pointercancel", up);
  btn.addEventListener("pointerleave", up);
  btn.addEventListener("touchstart", (e) => e.preventDefault(), { passive: false }); // no long-press buzz
}
bindPad($("bl"), "left");
bindPad($("br"), "right");
bindPad($("bj"), "jump");

const KEYS = { ArrowLeft: "left", a: "left", A: "left", ArrowRight: "right", d: "right", D: "right",
               ArrowUp: "jump", w: "jump", W: "jump", " ": "jump" };
window.addEventListener("keydown", (e) => { if (active && KEYS[e.key]) { input[KEYS[e.key]] = true; e.preventDefault(); } });
window.addEventListener("keyup", (e) => { if (KEYS[e.key]) input[KEYS[e.key]] = false; });
window.addEventListener("blur", () => { input.left = input.right = input.jump = false; });
document.addEventListener("contextmenu", (e) => { if (!e.target.closest("input")) e.preventDefault(); });
window.addEventListener("pagehide", () => { try { if (ws) ws.close(); } catch (_) {} });

// ── wiring ──────────────────────────────────────────────────────
$("btn-join").addEventListener("click", () => {
  localStorage.setItem("sq-name", $("in-name").value.trim().slice(0, 32));
  join();
});
$("btn-leave").addEventListener("click", () => leave(""));
$("btn-mute").addEventListener("click", toggleMute);
$("in-room").addEventListener("input", (e) => { e.target.value = e.target.value.toLowerCase().replace(/[^a-z0-9_-]/g, ""); });
[$("in-room"), $("in-name")].forEach((i) => i.addEventListener("keydown", (e) => { if (e.key === "Enter") $("btn-join").click(); }));

const q = new URLSearchParams(location.search);
if (q.get("room")) $("in-room").value = q.get("room").toLowerCase().replace(/[^a-z0-9_-]/g, "").slice(0, 32);
$("in-name").value = localStorage.getItem("sq-name") || "";
</script>
</body>
</html>
